<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>四季北觀心動大挑戰</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
    }

    h1 {
      margin: 15px 0;
    }

    #menu {
      padding: 20px;
    }

    .choice-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 400px;
      margin: auto;
    }

    .choice {
      border: 2px solid #ccc;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.2s;
      background: white;
    }

    .choice:hover {
      transform: scale(1.03);
      border-color: #333;
    }

    .choice img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }

    #game {
      display: none;
      padding: 20px;
      position: relative;
    }

    #timer {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #d80000;
    }

    #puzzle-board {
      width: 90vw;
      max-width: 360px;
      height: 90vw;
      max-height: 360px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 3px;
      background: #333;
      border-radius: 12px;
      padding: 5px;
      touch-action: none;
    }

    .piece {
      background-size: 300% 300%;
      border-radius: 8px;
      cursor: grab;
      border: 1px solid rgba(255,255,255,0.5);
    }

    .piece:active {
      cursor: grabbing;
    }

    /* 成功對話框 */
    #success-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 15px;
      width: 80%;
      max-width: 340px;
      text-align: center;
    }

    .modal-content h2 {
      margin: 0 0 10px;
      color: green;
    }

    .modal-content button {
      margin-top: 15px;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #007bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .modal-content button:hover {
      background: #0056b3;
    }

    /* 提示原圖（左下角） */
    #hint-image {
      display: none;
      position: fixed;
      left: 10px;
      bottom: 10px;
      width: 150px; /* 約50%縮小 */
      height: auto;
      border-radius: 12px;
      border: 3px solid white;
      box-shadow: 0 0 12px rgba(0,0,0,0.4);
      z-index: 500;
    }

    @media (max-width: 480px) {
      #hint-image {
        width: 120px;
      }
    }
  </style>
</head>

<body>

  <h1>🧩 四季北觀心動大挑戰</h1>

  <!-- 選單 -->
  <div id="menu">
    <h2>請選擇一款拼圖</h2>
    <div class="choice-container">
      <div class="choice" onclick="startGame(0)">
        <img src="01.jpg" alt="拼圖1">
      </div>
      <div class="choice" onclick="startGame(1)">
        <img src="02.jpg" alt="拼圖2">
      </div>
      <div class="choice" onclick="startGame(2)">
        <img src="03.jpg" alt="拼圖3">
      </div>
      <div class="choice" onclick="startGame(3)">
        <img src="04.jpg" alt="拼圖4">
      </div>
    </div>
  </div>

  <!-- 遊戲畫面 -->
  <div id="game">
    <div id="timer">剩餘時間：60 秒</div>
    <div id="puzzle-board"></div>
  </div>

  <!-- 左下角提示原圖 -->
  <img id="hint-image" src="" alt="提示原圖">

  <!-- 成功對話框 -->
  <div id="success-modal">
    <div class="modal-content">
      <h2>🎉 恭喜挑戰成功！</h2>
      <p>恭喜挑戰成功，請大聲唸出拼圖裡的景點名稱!</p>
      <button onclick="restartGame()">重來一次</button>
    </div>
  </div>

<script>
  const images = [
    "01.jpg",
    "02.jpg",
    "03.jpg",
    "04.jpg"
  ];

  let selectedImage = "";
  let pieces = [];
  let firstMove = false;
  let timer = 60;
  let countdownInterval = null;
  let gameFinished = false;

  const menu = document.getElementById("menu");
  const game = document.getElementById("game");
  const board = document.getElementById("puzzle-board");
  const timerText = document.getElementById("timer");
  const modal = document.getElementById("success-modal");
  const hintImage = document.getElementById("hint-image");

  function startGame(index) {
    selectedImage = images[index];

    menu.style.display = "none";
    game.style.display = "block";

    hintImage.style.display = "none";
    hintImage.src = selectedImage;

    createPuzzle();
  }

  function createPuzzle() {
    board.innerHTML = "";
    pieces = [];
    gameFinished = false;

    // 建立 9 片拼圖（正確順序：0~8）
    for (let i = 0; i < 9; i++) {
      pieces.push(i);
    }

    // 打亂順序
    pieces.sort(() => Math.random() - 0.5);

    // 建立拼圖DOM
    pieces.forEach((pieceIndex, position) => {
      const div = document.createElement("div");
      div.classList.add("piece");

      // 背景圖片
      div.style.backgroundImage = `url(${selectedImage})`;

      // 背景定位：依照 pieceIndex 決定顯示圖片哪一部分
      const x = pieceIndex % 3;
      const y = Math.floor(pieceIndex / 3);
      div.style.backgroundPosition = `${x * 50}% ${y * 50}%`;

      // 記錄正確片段 index
      div.dataset.correct = pieceIndex;
      div.dataset.position = position;

      // 拖曳事件（電腦）
      div.draggable = true;
      div.addEventListener("dragstart", dragStart);
      div.addEventListener("dragover", dragOver);
      div.addEventListener("drop", dropPiece);

      // 手機 touch 支援
      div.addEventListener("touchstart", touchStart, {passive:false});
      div.addEventListener("touchend", touchEnd, {passive:false});

      board.appendChild(div);
    });

    // 重設計時器
    resetTimer();
  }

  function resetTimer() {
    firstMove = false;
    timer = 60;
    timerText.textContent = `剩餘時間：${timer} 秒`;

    if (countdownInterval) {
      clearInterval(countdownInterval);
      countdownInterval = null;
    }

    hintImage.style.display = "none";
  }

  function startTimer() {
    if (countdownInterval) return;

    countdownInterval = setInterval(() => {
      if (gameFinished) return;

      timer--;
      timerText.textContent = `剩餘時間：${timer} 秒`;

      // 倒數超過20秒（剩40秒以下）顯示提示原圖
      if (timer <= 40 && !gameFinished) {
        hintImage.style.display = "block";
      }

      if (timer <= 0) {
        clearInterval(countdownInterval);
        countdownInterval = null;

        alert("時間到！挑戰失敗，請重試！");
        restartGame();
      }
    }, 1000);
  }

  // ---- 拖曳 (電腦) ----
  let draggedElement = null;

  function dragStart(e) {
    if (!firstMove) {
      firstMove = true;
      startTimer();
    }
    draggedElement = e.target;
  }

  function dragOver(e) {
    e.preventDefault();
  }

  function dropPiece(e) {
    e.preventDefault();
    const target = e.target;

    if (target.classList.contains("piece")) {
      swapPieces(draggedElement, target);
      checkWin();
    }
  }

  // ---- touch (手機) ----
  let touchedElement = null;

  function touchStart(e) {
    e.preventDefault();

    if (!firstMove) {
      firstMove = true;
      startTimer();
    }

    touchedElement = e.target;
  }

  function touchEnd(e) {
    e.preventDefault();

    const touch = e.changedTouches[0];
    const target = document.elementFromPoint(touch.clientX, touch.clientY);

    if (target && target.classList.contains("piece") && touchedElement) {
      swapPieces(touchedElement, target);
      checkWin();
    }
    touchedElement = null;
  }

  // ---- 交換拼圖 ----
  function swapPieces(piece1, piece2) {
    const tempBg = piece1.style.backgroundPosition;
    const tempCorrect = piece1.dataset.correct;

    piece1.style.backgroundPosition = piece2.style.backgroundPosition;
    piece1.dataset.correct = piece2.dataset.correct;

    piece2.style.backgroundPosition = tempBg;
    piece2.dataset.correct = tempCorrect;
  }

  // ---- 檢查是否完成 ----
  function checkWin() {
    const allPieces = document.querySelectorAll(".piece");
    let correctCount = 0;

    allPieces.forEach((piece, index) => {
      if (parseInt(piece.dataset.correct) === index) {
        correctCount++;
      }
    });

    if (correctCount === 9) {
      gameFinished = true;

      clearInterval(countdownInterval);
      countdownInterval = null;

      hintImage.style.display = "none";
      modal.style.display = "flex";
    }
  }

  // ---- 重來一次 ----
  function restartGame() {
    modal.style.display = "none";
    game.style.display = "none";
    menu.style.display = "block";

    resetTimer();
    board.innerHTML = "";
  }
</script>

</body>
</html>
